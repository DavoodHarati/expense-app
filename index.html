<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="هزینه‌ها">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>هزینه‌ها</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b1f23;--mut:#6b7280;--pri:#0f766e;--red:#dc2626;--grn:#16a34a}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,-apple-system,Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:140px}
header{background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;font-weight:700}
main{padding:12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:13px}
.red{color:var(--red)}.grn{color:var(--grn)}
button,input,textarea,select{font:inherit}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--pri);color:#fff}
button.sec{background:#e5e7eb;color:var(--tx)}
input,textarea,select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:#e5e7eb;color:var(--tx);border-radius:20px;padding:6px 12px;font-size:14}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #e5e7eb;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:12px 4px;font-size:13px}
nav button.on{color:var(--pri);font-weight:700}
.bar{height:8px;background:var(--pri);border-radius:4px;margin-top:4px}
.hide{display:none}
.ctb.on{background:var(--pri);color:#fff}
.chip.on{background:var(--pri);color:#fff}
.bdg{display:inline-block;padding:3px 10px;border-radius:12px;font-size:13px;font-weight:700}
.hero{background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}
.big{font-size:30px;font-weight:800;margin-top:4px}.big small{font-size:14px;font-weight:400}
summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::before{content:'◂';color:var(--pri);transition:transform .2s}
details[open]>summary::before{transform:rotate(-90deg)}
details.acc[open]>summary{margin-bottom:8px;color:var(--pri)}
details.acc>summary{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
details.dragging{box-shadow:0 8px 24px #0004;position:relative;z-index:5;opacity:.95;transition:none}
.card{border:1px solid #eef0f2}
details.acc input,details.acc select,details.acc textarea{background:#fafbfb}
.colbox{background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:10px;margin:8px 0}
.pcrow{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px}
.pcb{display:flex;align-items:center;gap:10px}.pcb b{font-size:20px;min-width:52px;text-align:center;color:var(--pri)}
.pcb button{padding:8px 14px;touch-action:manipulation}
.invoice-account-box{background:#f0fdfa;border:1px solid #b9e8e1;border-radius:12px;padding:12px;margin:12px 0;line-height:1.8}.invoice-result{border:1px solid #e3e9e8;border-radius:12px;padding:12px;margin:9px 0;line-height:1.8}.invoice-result summary{flex-wrap:wrap;font-size:14px}.invoice-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.invoice-actions button{font-size:13px}.invoice-ledger-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px;margin:12px 0}.invoice-ledger-grid>div{background:#f3f8f7;border-radius:10px;padding:10px;font-size:13px;color:#52635f}.invoice-ledger-grid b{display:block;color:#0f766e;margin-top:4px;font-size:15px}#invoice-card{line-height:1.75;font-size:14px}#invoice-card input,#invoice-card select{font-size:15px}#invoice-card button{margin-block:3px}</style>
<style>
.topic-nav{display:flex;gap:7px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid #e5e7eb;scrollbar-width:none;position:sticky;top:0;z-index:4}.topic-nav::-webkit-scrollbar{display:none}.topic-nav button{flex:0 0 auto;background:#edf3f2;color:#405652;padding:9px 13px;font-size:13px;white-space:nowrap}.topic-nav button.on{background:#0f766e;color:#fff;font-weight:700}.topic-heading{color:#0f766e;font-size:13px;margin:2px 3px 12px}.topic-actions{display:flex;gap:8px;flex-wrap:wrap}.topic-actions button{flex:1;min-width:125px}.topic-summary{background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}.topic-summary b{font-size:22px}.topic-nav[hidden]{display:none}
</style>
<style>.invoice-category-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0}.invoice-category-grid button{font-size:13px;padding:10px 8px;line-height:1.6}#invoice-card{font-size:14px;line-height:1.7}#invoice-card .mut,.invoice-ledger .mut{font-size:12px;line-height:1.75}#invoice-card input,#invoice-card select{font-size:16px}#invoice-card summary b,#inv-total{font-size:16px;color:#0f766e}.invoice-result summary b,.invoice-ledger-grid b{font-size:15px}</style><style>.diary-chips,.add-sections{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:#fff}.diary-chips[hidden],.add-sections[hidden]{display:none}.diary-chips button,.add-sections button,.topic-nav button,nav button{min-height:44px}.diary-chips button,.add-sections button{white-space:nowrap;border-radius:22px;background:#edf3f2;color:#405652}.diary-chips button.on,.add-sections button.on{background:#0f766e;color:white}.nav-add{font-size:19px!important;font-weight:700;color:#0f766e!important}</style></head>
<body>
<header id="title">هزینه‌ها</header>
<div class="diary-chips" id="diary-chips" hidden aria-label="بخش دفتر"><button type="button" data-t="report">گزارش</button><button type="button" data-t="contacts">اشخاص</button></div>
<div class="topic-nav" id="topics" aria-label="موضوع برنامه">
  <button type="button" data-topic="expenses">تراکنش‌ها</button>
  <button type="button" data-topic="invoices">فاکتورها</button>
  <button type="button" data-topic="receipts">رسیدها</button>
  <button type="button" data-topic="work">کارکردها</button>
  <button type="button" data-topic="sales">فروش‌ها</button>
  <button type="button" data-topic="reminders">یادآوری</button>
</div>
<div class="add-sections" id="add-sections" hidden aria-label="انتخاب بخش ثبت"><button type="button" data-add-topic="expenses">تراکنش‌ها</button><button type="button" data-add-topic="invoices">فاکتور</button><button type="button" data-add-topic="receipts">رسید</button><button type="button" data-add-topic="work">کارکرد</button><button type="button" data-add-topic="sales">فروش</button><button type="button" data-add-topic="reminders">یادآوری</button></div>
<main id="app"></main>
<nav>
  <button data-t="home">خانه</button>
  <button data-t="add" class="nav-add">＋ ثبت</button>
  <button data-t="diary">دفتر</button>
  <button data-t="settings">تنظیمات</button>
</nav>

<script src="invoice.js?v=163"></script>
<script src="legacy-inbox.js?v=163"></script>
<script src="easy-google-setup.js?v=163"></script>
<script src="features-157.js?v=163"></script>
<script src="app.js?v=163"></script>
</body>
</html>
